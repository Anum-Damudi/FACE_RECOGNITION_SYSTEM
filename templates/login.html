<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTINEL :: Security Console</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="scanlines"></div>
<div class="noise"></div>
<div class="radar"></div>
<div class="particles"></div>

<header class="top-status-bar">
    <div>NEURAL CORE ONLINE</div>
    <div>DB INDEX ACTIVE</div>
    <div>THREAT LEVEL GREEN</div>
</header>

<div class="login-screen">

    <div class="logo-area">

        <div class="shield-icon">
            <div class="shield-core"></div>
        </div>

        <h1>SENTINEL</h1>

        <p>FACIAL RECOGNITION SECURITY CONSOLE</p>

    </div>

    <div class="login-panel">

        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>

        <div class="panel-glow"></div>

        {% if error %}
            <div class="error-box">{{ error }}</div>
        {% endif %}

        <form method="POST">

            <div class="input-group">
                <span class="input-icon">◉</span>
                <input type="text"
                       name="username"
                       placeholder="OPERATOR ID"
                       required>
            </div>

            <div class="input-group">
                <span class="input-icon">⌁</span>
                <input type="password"
                       name="password"
                       placeholder="ACCESS CODE"
                       required>
            </div>

            <button type="submit" class="auth-btn">
                AUTHENTICATE
                <span class="shine"></span>
            </button>

        </form>

    </div>

</div>

<script src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>
</html>
